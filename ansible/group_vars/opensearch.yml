---
ansible_host: "{{ lookup('ansible.builtin.pipe', 'terraform -chdir=../terraform output -raw opensearch_public_ip') }}"

opensearch_extra_internal_users:
  app_writer:
    hash: "{{ vault_opensearch_app_writer_password_hash }}"
    description: "Application user with write access to app-* indices"

opensearch_extra_roles:
  app_write_role:
    cluster_permissions: []
    index_permissions:
      - index_patterns: ["app-*"]
        allowed_actions: ["crud", "create_index"]

opensearch_extra_roles_mapping:
  app_write_role:
    users: ["app_writer"]
