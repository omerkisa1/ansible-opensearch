---
- name: Prepare Opensearch Server
  hosts: opensearch
  become: true

  roles:
    - opensearch


  tasks:
    - name: check os
      ansible.builtin.debug:
        msg: "OS: {{ ansible_facts['distribution'] }} {{ansible_facts['distribution_version'] }}"

    - name: check server resources
      ansible.builtin.debug:
        msg:
          - "RAM: {{ ansible_facts['memtotal_mb']}} MB"
          - "CPU cores: {{ ansible_facts['processor_vcpus'] }}"

    - name: update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: install required packages
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - gnupg
        state: present