---
- name: Prepare operating system for OpenSearch
  ansible.builtin.import_tasks: system.yml

- name: Install OpenSearch
  ansible.builtin.import_tasks: install.yml

- name: Configure OpenSearch TLS certificates
  ansible.builtin.import_tasks: certs.yml

- name: Configure OpenSearch
  ansible.builtin.import_tasks: config.yml

- name: Manage OpenSearch service
  ansible.builtin.import_tasks: service.yml

- name: Verify OpenSearch health
  ansible.builtin.import_tasks: healthcheck.yml
