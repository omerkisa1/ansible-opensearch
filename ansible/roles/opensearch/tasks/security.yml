---
- name: Check that password hashes are unique
  vars:
    opensearch_password_hashes: "{{ opensearch_internal_users | combine(opensearch_extra_internal_users) | dict2items | map(attribute='value.hash') | list }}"
  ansible.builtin.assert:
    that: opensearch_password_hashes | length == opensearch_password_hashes | unique | length
    fail_msg: Two users share the same password hash. Each vault_*_password_hash must be generated separately.
    quiet: true

- name: Check that the admin password matches its hash
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - 'import sys, bcrypt; p, h = sys.stdin.read().split(chr(10)); sys.exit(not bcrypt.checkpw(p.encode(), h.encode()))'
    stdin: "{{ opensearch_admin_password }}\n{{ opensearch_internal_users[opensearch_admin_user].hash }}"
    stdin_add_newline: false
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  no_log: true

- name: Configure security plugin files
  ansible.builtin.template:
    src: security_config.yml.j2
    dest: "{{ opensearch_security_config_dir }}/{{ item.file }}"
    owner: root
    group: opensearch
    mode: "0640"
  loop:
    - file: internal_users.yml
      type: internalusers
      config: "{{ opensearch_internal_users | combine(opensearch_extra_internal_users) }}"
    - file: roles.yml
      type: roles
      config: "{{ opensearch_roles | combine(opensearch_extra_roles) }}"
    - file: roles_mapping.yml
      type: rolesmapping
      config: "{{ opensearch_roles_mapping | combine(opensearch_extra_roles_mapping) }}"
  loop_control:
    label: "{{ item.file }}"
  no_log: true
  register: opensearch_security_files

- name: Apply changed security configuration
  ansible.builtin.command:
    argv:
      - "{{ opensearch_securityadmin_path }}"
      - -f
      - "{{ opensearch_security_config_dir }}/{{ item.item.file }}"
      - -t
      - "{{ item.item.type }}"
      - -cacert
      - "{{ opensearch_certs_dir }}/root-ca.pem"
      - -cert
      - "{{ opensearch_certs_dir }}/admin.pem"
      - -key
      - "{{ opensearch_certs_dir }}/admin-key.pem"
      - -h
      - localhost
  environment:
    OPENSEARCH_JAVA_HOME: /usr/share/opensearch/jdk
  loop: "{{ opensearch_security_files.results | selectattr('changed') | list }}"
  loop_control:
    label: "{{ item.item.file }}"
  changed_when: true

- name: Verify admin password authentication
  ansible.builtin.uri:
    url: "https://localhost:{{ opensearch_http_port }}/_plugins/_security/authinfo"
    method: GET
    user: "{{ opensearch_admin_user }}"
    password: "{{ opensearch_admin_password }}"
    force_basic_auth: true
    validate_certs: true
    ca_path: "{{ opensearch_certs_dir }}/root-ca.pem"
    status_code: [200, 401]
  register: opensearch_admin_auth
  changed_when: false

- name: Fail if the admin password does not match its hash
  ansible.builtin.fail:
    msg: >-
      Admin login with the vault password returned HTTP 401.
      vault_opensearch_admin_password_hash was not generated from
      vault_opensearch_admin_password.
  when: opensearch_admin_auth.status == 401
