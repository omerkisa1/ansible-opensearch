---
- name: Set vm.max_map_count
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "{{ opensearch_max_map_count }}"
    sysctl_file: /etc/sysctl.d/90-opensearch.conf
    state: present
    reload: true

- name: Set vm.swappiness
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ opensearch_swappiness }}"
    sysctl_file: /etc/sysctl.d/90-opensearch.conf
    state: present
    reload: true

- name: Disable active swap
  ansible.builtin.command: swapoff -a
  when: ansible_facts['swaptotal_mb'] | int > 0
  changed_when: true

- name: Comment out swap entries in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\s]\S*\s+\S+\s+swap\s+.*)$'
    replace: '# \1'

- name: Ensure OpenSearch systemd override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/opensearch.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure OpenSearch systemd resource limits
  ansible.builtin.copy:
    dest: /etc/systemd/system/opensearch.service.d/override.conf
    content: |
      # Managed by Ansible
      [Service]
      LimitMEMLOCK=infinity
      LimitNOFILE={{ opensearch_nofile_limit }}
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
