---
- name: Configure opensearch.yml
  ansible.builtin.template:
    src: opensearch.yml.j2
    dest: /etc/opensearch/opensearch.yml
    owner: root
    group: opensearch
    mode: "0640"
    backup: true
  notify: Restart OpenSearch

- name: Configure JVM heap size
  ansible.builtin.template:
    src: heap.options.j2
    dest: /etc/opensearch/jvm.options.d/heap.options
    owner: root
    group: opensearch
    mode: "0640"
  notify: Restart OpenSearch

- name: Remove demo certificates
  ansible.builtin.file:
    path: "/etc/opensearch/{{ item }}"
    state: absent
  loop:
    - esnode.pem
    - esnode-key.pem
    - kirk.pem
    - kirk-key.pem
    - root-ca.pem
